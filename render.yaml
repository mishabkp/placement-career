services:
  - type: web
    name: placement-pal-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROJECT_NAME
        value: PlacementPal AI Backend
      - key: GEMINI_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: DATABASE_URL
        sync: false          # Set this manually in Render dashboard (Neon/Supabase URL)
      - key: JWT_SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
